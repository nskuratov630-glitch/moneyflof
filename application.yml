spring:
  application:
    name: moneyflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moneyflow}
    username: ${SPRING_DATASOURCE_USERNAME:moneyflow}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
    show-details: never
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-only-secret-change-this-to-at-least-32-bytes}
    expiration-minutes: 720
