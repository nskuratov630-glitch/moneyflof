services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moneyflow
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
    volumes:
      - moneyflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow -d moneyflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/moneyflow
      SPRING_DATASOURCE_USERNAME: moneyflow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-only-secret-change-this-to-at-least-32-bytes}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  moneyflow_pg:
